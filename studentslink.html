<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./reset.css">
    <link rel="stylesheet" type="text/css" href="./index.css">
    <link rel="icon" type="icon/png" href="./assets/icon.png">
    <title>Vladislavlev</title>
</head>
<body id="body" style="display: none">
<div style="display: flex; gap: 8px;">
  <!-- Input box with the link -->
  <input type="text" value="https://example.com" id="linkField" readonly>
  <!-- Button to trigger the copy function -->
  <button id="inputCopyBtn" onclick="copyFromInput()">Copy</button>
</div>

<script>
function copyFromInput() {
  // Target the input element
  const inputEl = document.getElementById("linkField");
  
  // Copy the input field's value
  navigator.clipboard.writeText(inputEl.value).then(() => {
    const btn = document.getElementById("inputCopyBtn");
    btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 2000);
  });
}
</script>
